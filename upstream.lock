# Merge base for tools/sync-upstream.
#
# sha tracks the omarchy that is INSTALLED, not the tip of the release branch: the
# panel is not self-contained, it imports shell-provided types and members, so
# panel code from a newer omarchy can reference API this machine lacks. Update
# omarchy first, then run tools/sync-upstream; until then --check reporting drift
# is information, not an action item.
#
# branch is the RELEASE branch for the installed omarchy, not the development
# branch: `quattro` is upstream's default HEAD and rolls forward continuously, so
# merging against it pulls in work no released omarchy has. Releases form a
# fast-forward chain, so after `omarchy update` the pin walks forward, and
# --check warns when branch= does not match the installed omarchy.
#
# path  where the first-party plugin lives in the omarchy tree.
# repo  branch  where to fetch from.
#
# Only tools/sync-upstream should change sha, and only after a conflict-free
# merge; editing it by hand to skip a version discards the changes in between.
# The v4-5-0 pin is the documented exception: set by hand after a manual merge
# (docs/CONTRIBUTING.md, "Pin exception (v4.5.0)").
sha=ac2690cd7be4f47e4a255f5e2e78d904d436b068
path=shell/plugins/panels/power
repo=https://github.com/omacom/omarchy.git
branch=v4-5-0
