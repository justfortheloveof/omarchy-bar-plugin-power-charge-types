# Everything bin/check runs locally, minus the stages that need an Omarchy box.
# Skipped stages are not green stages, which is why bin/check prints the count.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Only the checkout below needs a token, and only to clone. Naming one scope
    # sets every other scope to none, so a step that quietly wanted more fails
    # instead of getting it: bin/check runs code out of the pull request.
    permissions:
      contents: read

    # Nothing here is interactive, so a hung step should not cost the 360-minute
    # default.
    timeout-minutes: 15

    steps:
      # Pinned to a commit, not the v7 tag: a moved tag is code this repository
      # never reviewed. Dependabot keeps the pins fresh - see
      # .github/dependabot.yml - because a pin nobody updates is worse than a tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, and v6+ keeps the token in $RUNNER_TEMP rather
          # than .git/config regardless.
          persist-credentials: "false"

      # Pin Node so the runner image's default cannot drift under the tests.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # There is no package.json or lockfile here, and setup-node v6 would
          # otherwise go looking for one to cache.
          package-manager-cache: "false"

      # qmllint, for the Panel.qml parse check. Ubuntu does not put Qt's bin
      # directory on PATH, so point at it when the install worked.
      - name: Install Qt tools
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools
          for d in /usr/lib/qt6/bin /usr/lib/x86_64-linux-gnu/qt6/bin; do
            if [ -x "$d/qmllint" ]; then
              echo "QML_BIN=$d" >> "$GITHUB_ENV"
              break
            fi
          done

      # The helper tests fake root with `unshare -r`, which Ubuntu 24.04's
      # AppArmor refuses by default (LP #2046477); the sysctl relaxes that, and
      # `|| true` because a later image may allow it natively. The `unshare -r
      # true` is the gate: if userns is genuinely unavailable the run goes red
      # here, at a named step, rather than quietly testing fewer things.
      - name: Allow `unshare -r` for the helper tests
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -r true

      - name: bin/check
        run: |
          if [ -n "${QML_BIN:-}" ]; then
            echo "$QML_BIN" >> "$GITHUB_PATH"
          fi
          bin/check

      # CI has no Omarchy, so the manifest validation and shell API stages are
      # always skipped here; bin/check lists them so a skipped run never reads
      # as fully green. The Model.js comparison and the Panel.qml marker
      # coverage do run (sync-upstream --check fetches its mirror), keeping
      # those invariants enforced by CI rather than by whoever remembers to run
      # bin/check locally.
